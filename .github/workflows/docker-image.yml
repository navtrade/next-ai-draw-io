name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/next-ai-draw-io

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push with Docker Compose
        if: github.event_name != 'pull_request'
        run: |
          docker-compose build
          docker tag next-ai-draw-io:latest ${{ env.IMAGE_NAME }}:latest
          docker tag next-ai-draw-io:latest ${{ env.IMAGE_NAME }}:$(date +%Y%m%d-%H%M%S)
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:$(date +%Y%m%d-%H%M%S)

      - name: Build only (for PR)
        if: github.event_name == 'pull_request'
        run: docker-compose build
